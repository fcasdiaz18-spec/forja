<html lang="es">

<style>
:root{--bg:#0B0C0E;--s1:#15171A;--s2:#1D2024;--ln:#24272C;--ln2:#2A2E33;--tx:#F2F3F5;--mu:#9AA0A8;--cf:#FF6B1A;--hy:#6FA8FF;--pa:#C6F432;--bad:#FF8A80;--disp:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
#view{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 112px);display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:1;letter-spacing:.01em}
.h1{font-size:clamp(30px,9.5vw,40px)}
header{gap:12px}header>div{min-width:0}.h2{font-size:22px;font-weight:700}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.tile{background:var(--s2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.tile{background:var(--s1)}
.lbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.num{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1}
.num.md{font-size:26px;font-weight:700}
.num small{font-size:15px;color:var(--mu);font-weight:600}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sm{font-size:13px;line-height:1.45}.xs{font-size:12px}
.muted{color:var(--mu)}
.up{color:var(--pa)}.down{color:var(--bad)}
.btn{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--ln2);background:var(--s2);color:var(--tx);font:600 14px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0}
.btn.pri{background:var(--cf);border-color:var(--cf);color:#0B0C0E;font-weight:700}
.btn.lime{background:var(--pa);border-color:var(--pa);color:#0B0C0E;font-weight:700}
.btn.ghost{background:transparent}
.btn.big{min-height:54px;font-family:var(--disp);font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;width:100%}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.iconbtn{width:46px;height:46px;border-radius:50%;border:2px solid var(--cf);background:var(--s1);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pill{font-size:12px;color:var(--mu);background:var(--s2);border-radius:999px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mu)}
input,select,textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);padding:0 12px;font:500 16px Inter,system-ui,sans-serif;-webkit-appearance:none;appearance:none}
input[type=date]{min-width:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{padding:12px;min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cf);outline-offset:1px}
.card input,.card select,.card textarea{background:var(--s2)}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:496px;margin:0 auto;background:rgba(21,23,26,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:26px;padding:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;z-index:10}
.tabbar button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:20px;font:600 11px Inter,system-ui,sans-serif;cursor:pointer}
.tabbar button.on{background:var(--s2);color:var(--cf);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--mu);font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg)}
.photo{aspect-ratio:3/4;border-radius:18px;background:var(--s1);border:1px dashed #3A3F46;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mu);cursor:pointer;text-align:center;padding:8px}
.photo.has{border:1px solid var(--cf)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--bg);color:var(--mu);border-radius:999px;padding:5px 9px;z-index:1}
.badge.on{background:var(--cf);color:#0B0C0E}
.bar{height:6px;background:var(--ln);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--ln);background:none;color:var(--tx);text-align:left;font:inherit;cursor:pointer}
.item:first-child{border-top:0}
.item b{font-size:15px;font-weight:700}
.ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mtable .r{display:grid;grid-template-columns:1fr 70px 64px;align-items:center;padding:11px 0;border-top:1px solid var(--ln);font-size:14px}
.mtable .r b{font-family:var(--disp);font-size:20px;text-align:right}
.mtable .r span:last-child{text-align:right;font-weight:700;font-size:12px}
.light{background:var(--tx);color:var(--bg);border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.light .muted{color:#4A4F57}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
details{background:var(--s2);border-radius:14px;padding:0 14px}
details summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open]{padding-bottom:14px}
details ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5}
pre{background:var(--bg);border:1px solid var(--ln2);border-radius:12px;padding:12px;margin:8px 0 0;white-space:pre-wrap;word-break:break-all;font:12px/1.5 ui-monospace,Menlo,monospace;color:#C9CDD3}
code{font:13px ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 5px;border-radius:6px;color:#E6E8EB;word-break:break-all}
a{color:var(--hy)}
dialog{width:100%;max-width:520px;max-height:92vh;margin:auto auto 0;border:0;border-radius:24px 24px 0 0;background:var(--s1);color:var(--tx);padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-160%);background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:transform .25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:28px 18px;align-items:center}
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daychip{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);font:700 11px Inter,system-ui,sans-serif;cursor:pointer;text-transform:uppercase}
.daychip b{font-family:var(--disp);font-size:22px;color:var(--tx);line-height:1}
.daychip.hoy{background:var(--cf);border-color:var(--cf);color:#0B0C0E}.daychip.hoy b{color:#0B0C0E}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.pbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--tx);text-align:left;font:inherit;cursor:pointer;padding:0}
.hora{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;min-width:56px}
.pitem.done .hora,.pitem.done b{opacity:.55}
#tip{position:fixed;z-index:70;background:var(--tx);color:var(--bg);font:600 12px Inter,system-ui,sans-serif;padding:6px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));left:0;top:0}
#tip.show{opacity:1}
.chart text{font:600 10px Inter,system-ui,sans-serif;fill:#9AA0A8}
.chart [data-tip]{cursor:pointer}
.ins{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.ins .ar{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800;background:var(--s2)}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
[hidden]{display:none!important}
</style>
</head>

<script>
'use strict';
/* ================= Constantes ================= */
const VERSION='1.2';
const COLORS={crossfit:'#FF6B1A',hyrox:'#6FA8FF',padel:'#C6F432'};
const TIPOS={crossfit:'CrossFit',hyrox:'HYROX',padel:'Pádel'};
const ANGULOS=[['frente','Frente'],['perfil','Perfil'],['espalda','Espalda']];
const ESTACIONES=['SkiErg 1.000 m','Sled Push','Sled Pull','Burpee Broad Jump','Remo 1.000 m','Farmers Carry','Sandbag Lunges','Wall Balls'];
const MEDIDAS=[['cintura','Cintura (ombligo)',-1],['pecho','Pecho',1],['cadera','Cadera',-1],['brazo','Brazo (contraído)',1],['muslo','Muslo',1]];
const MODELOS=[['claude-sonnet-5-5','Claude Sonnet 5.5 · recomendado'],['claude-opus-5-5','Claude Opus 5.5 · más preciso'],['claude-haiku-5-5','Claude Haiku 5.5 · más económico']];
const DEF={nombre:'Felipe',metaPeso:'',metaKcal:900,compNombre:'',compFecha:'',gistId:'',gistSeen:[],lastSync:'',lastRaw:'',apiKey:'',modelo:'claude-sonnet-5-5'};
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const ICON={
 crossfit:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',
 hyrox:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
 padel:'<circle cx="10" cy="9" r="6"/><path d="M14.5 13.5L21 20"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 sync:'<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M18 2v4h-4M6 22v-4h4"/>',
 watch:'<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6V2h6v4M9 18v4h6v-4"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',
 chevL:'<path d="M15 6l-6 6 6 6"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 share:'<path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ico=(n,s=22,c='currentColor',w=2)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const today=()=>ymd(new Date());
const diffDays=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const fFecha=s=>{if(!s)return'—';const d=parseYmd(s);return `${d.getDate()} ${MESES[d.getMonth()]}`;};
const fN=(n,dec=1)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('es-CL',{maximumFractionDigits:dec});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
const rng=(v,a,b)=>v==null||v<a||v>b?null:v;
function parseNum(v){
 if(v==null||v==='')return null;
 if(typeof v==='number')return isFinite(v)?v:null;
 let s=String(v).trim().replace(/\s/g,'').replace(/[^\d,.\-]/g,'');
 if(!s||s==='-')return null;
 if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
 else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=parseFloat(s);return isFinite(n)?n:null;
}
function parseDur(v){ // devuelve minutos
 if(v==null||v==='')return null;
 const s=String(v).toLowerCase();
 const h=s.match(/(\d+[.,]?\d*)\s*h/), m=s.match(/(\d+)\s*min/);
 if(h||m)return (h?parseNum(h[1])*60:0)+(m?parseInt(m[1],10):0);
 if(/\d+:\d+/.test(s)){const p=s.match(/[\d:]+/)[0].split(':').map(Number);return p.length===3?p[0]*60+p[1]+p[2]/60:p[0]*60+p[1];}
 const n=parseNum(v);if(n==null)return null;
 if(n>1440)return n/60; if(n<=24)return n*60; return n;
}
function parseTime(s){if(!s)return null;const p=String(s).trim().replace(/[.,;' ]/g,':').split(':').map(x=>parseInt(x,10));if(!p.length||p.some(isNaN))return null;return p.reduce((a,x)=>a*60+x,0);}
function fTime(sec){if(sec==null)return'—';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;}
function fDur(min){if(min==null)return'—';const h=Math.floor(min/60),m=Math.round(min%60);return `${h}:${pad(m)}`;}
function normFecha(s){if(!s)return null;s=String(s).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;return null;}
function relTime(iso){if(!iso)return'nunca';const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return'recién';if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;return`hace ${Math.round(h/24)} días`;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
const urls=new WeakMap();
function photoURL(b){if(!b)return null;if(!urls.has(b))urls.set(b,URL.createObjectURL(b));return urls.get(b);}
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();i.onload=()=>{res(i);URL.revokeObjectURL(u);};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('No se pudo leer la imagen'));};i.src=u;});}
async function compress(blob,max=1400,q=.82){const img=await loadImg(blob);const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q));}
async function toB64(blob,max=1024){const b=await compress(blob,max,.8);const bytes=new Uint8Array(await b.arrayBuffer());let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('forja',2);r.onupgradeneeded=()=>{const d=r.result;const mk=(n,o)=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,o);};mk('dias',{keyPath:'fecha'});mk('checkins',{keyPath:'id'});mk('entrenos',{keyPath:'id',autoIncrement:true});mk('prs',{keyPath:'id',autoIncrement:true});mk('kv');mk('plan',{keyPath:'id',autoIncrement:true});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const st=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbAll=n=>rq(st(n).getAll());
const dbGet=(n,k)=>rq(st(n).get(k));
const dbPut=(n,v,k)=>rq(k===undefined?st(n,'readwrite').put(v):st(n,'readwrite').put(v,k));
const dbDel=(n,k)=>rq(st(n,'readwrite').delete(k));
const dbClear=n=>rq(st(n,'readwrite').clear());

/* ================= Datos del Apple Watch ================= */
async function mergeDia(fecha,vals){
 const clean=Object.fromEntries(Object.entries(vals).filter(([,v])=>v!=null&&!isNaN(v)));
 if(!Object.keys(clean).length)return 0;
 const ex=await dbGet('dias',fecha)||{fecha};
 await dbPut('dias',{...ex,...clean});return 1;
}
async function importSalud(o){
 if(Array.isArray(o)){let n=0;for(const x of o)n+=await importSalud(x);return n;}
 if(o&&Array.isArray(o.dias))return importSalud(o.dias);
 if(!o||typeof o!=='object'||!Object.keys(o).length)return 0;
 S.lastRaw=JSON.stringify(o).slice(0,2000);
 const f=normFecha(o.fecha)||today(), ay=addDays(f,-1);
 let gr=parseNum(o.grasa);if(gr!=null&&gr<=1)gr*=100;
 let n=0;
 n+=await mergeDia(ay,{kcal:rng(parseNum(o.kcal_ayer),0,15000),ejercicio:rng(parseNum(o.ejercicio_ayer),0,1440),pasos:rng(parseNum(o.pasos_ayer),0,150000)});
 n+=await mergeDia(f,{
  kcal:rng(parseNum(o.kcal??o.kcal_hoy),0,15000),ejercicio:rng(parseNum(o.ejercicio??o.ejercicio_hoy),0,1440),pasos:rng(parseNum(o.pasos??o.pasos_hoy),0,150000),
  sueno_min:rng(parseDur(o.sueno??o.sueno_min),0,1100),profundo:rng(parseDur(o.profundo),0,600),rem:rng(parseDur(o.rem),0,600),nucleo:rng(parseDur(o.nucleo),0,900),hrv:rng(parseNum(o.hrv),5,300),fc_reposo:rng(parseNum(o.fc_reposo),25,130),
  vo2max:rng(parseNum(o.vo2max),15,95),peso:rng(parseNum(o.peso),30,250),grasa:rng(gr,2,60)});
 return n;
}
function gistIdLimpio(){return (S.gistId||'').trim().replace(/\/+$/,'').split('/').pop().split('#')[0];}
async function syncGist(silent){
 const id=gistIdLimpio();
 if(!id){if(!silent){toast('Configura el ID del Gist en Ajustes');go('ajustes');}return;}
 if(ui.sincronizando)return; ui.sincronizando=true; if(!silent)render();
 try{
  const H={headers:{Accept:'application/vnd.github+json'},cache:'no-store'};
  const r=await fetch(`https://api.github.com/gists/${id}/commits?per_page=30`,H);
  if(!r.ok)throw new Error(r.status===404?'Gist no encontrado: revisa el ID':r.status===403||r.status===429?'Límite de GitHub alcanzado, intenta en una hora':'Error de GitHub '+r.status);
  const commits=await r.json();const seen=new Set(S.gistSeen||[]);
  const nuevos=commits.filter(c=>!seen.has(c.version)).slice(0,20).reverse();
  let n=0;
  for(const c of nuevos){
   const rr=await fetch(`https://api.github.com/gists/${id}/${c.version}`,H);if(!rr.ok)continue;
   const g=await rr.json();const files=g.files||{};const f=files['salud.json']||Object.values(files)[0];
   if(f){let txt=f.content;if(f.truncated)txt=await(await fetch(f.raw_url)).text();
    try{n+=await importSalud(JSON.parse(txt));}catch(e){console.warn('Revisión con JSON inválido',c.version,e);S.lastRaw='JSON inválido: '+String(txt).slice(0,600);}}
   seen.add(c.version);
  }
  S.gistSeen=[...seen].slice(-300);S.lastSync=new Date().toISOString();await saveS();
  if(!silent||n)toast(n?`Watch sincronizado · ${n} registro(s) nuevos`:'Todo al día');
 }catch(e){if(!silent)toast(e.message);console.warn(e);}
 finally{ui.sincronizando=false;await refresh();}
}
function autoSync(){if(!gistIdLimpio())return;if(S.lastSync&&Date.now()-new Date(S.lastSync)<10*6e4)return;syncGist(true);}
async function importarTexto(txt){
 let o;try{o=JSON.parse(String(txt).trim());}catch(e){throw new Error('El texto no es un JSON válido');}
 const n=await importSalud(o);await saveS();await refresh();toast(n?'Datos del Watch importados':'No encontré datos en el JSON');
}
async function pegarSalud(){
 try{const t=await navigator.clipboard.readText();if(t&&t.trim().startsWith('{')||t&&t.trim().startsWith('[')){await importarTexto(t);return;}}catch(e){}
 openModal(`<form data-form="pegar" class="stack"><div class="row between"><h2 class="disp h2">Pegar datos del Watch</h2><button type="button" class="btn ghost" data-act="cerrar" aria-label="Cerrar">${ico('x',18)}</button></div>

}

/* ================= Cálculos ================= */
function latest(field,maxAge=9999){for(let i=D.dias.length-1;i>=0;i--){const d=D.dias[i];if(d[field]!=null&&diffDays(d.fecha,today())<=maxAge)return d;}return null;}
function recovery(){
 const t=today();const cand=D.dias.filter(d=>diffDays(d.fecha,t)<=1&&(d.hrv!=null||d.sueno_min!=null));const d=cand[cand.length-1];if(!d)return null;
 const base=D.dias.filter(x=>x.fecha<d.fecha&&diffDays(x.fecha,d.fecha)<=7);
 const bh=avg(base.map(x=>x.hrv)),br=avg(base.map(x=>x.fc_reposo));
 let s=62;const notas=[];
 if(d.hrv!=null&&bh){const r=d.hrv/bh-1;s+=clamp(r/.25,-1,1)*22;notas.push(`HRV ${r>=0?'+':''}${fN(r*100,0)}% vs tu media de 7 días`);}
 if(d.fc_reposo!=null&&br){const r=d.fc_reposo-br;s-=clamp(r/6,-1,1)*14;notas.push(`pulso en reposo ${r>0?'+':''}${fN(r,0)} lpm`);}
 if(d.sueno_min!=null){s+=clamp((d.sueno_min/60-7)/1.5,-1,1)*14;notas.push(`${fDur(d.sueno_min)} h de sueño`);}
 s=Math.round(clamp(s,1,100));
 const txt=s>=75?'Listo para cargar fuerte':s>=55?'Día de trabajo moderado':'Prioriza recuperación';
 return {s,txt,d,notas,conBase:!!bh};
}
function pesoSerie(){const m=new Map();D.dias.forEach(d=>{if(d.peso!=null)m.set(d.fecha,d.peso);});D.checkins.forEach(c=>{if(c.peso!=null)m.set(c.id,c.peso);});return[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).slice(-150);}
function grasaDe(c){const a=c?.analisis;return a&&a.grasa_min!=null&&a.grasa_max!=null?(Number(a.grasa_min)+Number(a.grasa_max))/2:null;}
function deltaHtml(d,dir,unit='',dec=1){if(d==null||isNaN(d))return'';const r=Math.round(d*10**dec)/10**dec;if(r===0)return`<span class="xs muted" style="font-weight:600">= sin cambio</span>`;const good=r*dir>0;return`<span class="xs ${good?'up':'down'}" style="font-weight:700">${r>0?'▲':'▼'} ${fN(Math.abs(r),dec)}${unit}</span>`;}

async function copiarSemana(){

function barChart(groups,o={}){
 const ref=o.ref??null,dec=o.dec||0,unit=o.unit||'';
 const W=320,H=110,iw=W-36,n=groups.length;const gap=n>40?1:n>14?3:6;const bw=Math.max(2,(iw-gap*(n-1))/n);
 const tot=groups.map(g=>g.segs.reduce((a,s)=>a+s.v,0));const mx=Math.max(...tot,ref||0)*1.1||1;
 const every=n<=8?1:n<=14?3:7;
 const bars=groups.map((g,i)=>{const x=i*(bw+gap);let y=H;let r='';const segs=g.segs.filter(s=>s.v>0);
  if(!segs.length)r+=`<rect x="${x.toFixed(1)}" y="${H-2}" width="${bw.toFixed(1)}" height="2" rx="1" fill="#2A2E33"/>`;
  segs.forEach((s,j)=>{const h=Math.max(2,s.v/mx*H-(j>0?2:0));y-=h+(j>0?2:0);r+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3,bw/2).toFixed(1)}" fill="${s.color}"/>`;});
  r+=`<rect x="${(x-gap/2).toFixed(1)}" y="0" width="${(bw+gap).toFixed(1)}" height="${H}" fill="transparent" data-tip="${esc(g.tip)}"/>`;
  if(i%every===(n-1)%every)r+=`<text x="${(x+bw/2).toFixed(1)}" y="${H+16}" text-anchor="middle">${esc(g.label)}</text>`;
  return r;}).join('');
 return `<svg class="chart" viewBox="-2 -6 ${W+2} ${H+26}" width="100%" role="img" aria-label="${esc(o.label||'Gráfico de barras')}">

 <text x="${iw+6}" y="${(H-(mx/1.1)/mx*H+3).toFixed(1)}">${fN(mx/1.1,dec)}${unit}</text>
 ${bars}
 ${ref!=null?`<line x1="0" x2="${iw}" y1="${(H-ref/mx*H).toFixed(1)}" y2="${(H-ref/mx*H).toFixed(1)}" stroke="#F2F3F5" stroke-opacity=".7" stroke-width="1.2" stroke-dasharray="4 4" pointer-events="none"/>`:''}</svg>`;
}

 const m=(a,k)=>avg(a.map(d=>d[k]));const sum=a=>a.reduce((s,e)=>s+(e.duracion||0),0);

 const per=n===7?'7 días':n===28?'4 semanas':'12 semanas';
 // destacados

 if(minP>0&&minC>0){const r=minC/minP-1;if(Math.abs(r)>=.1)add(r>0,`Entrenaste ${fN(Math.abs(r)*100,0)}% ${r>0?'más':'menos'} minutos que en las ${per} anteriores.`);}
 if(dd('sue')!=null&&Math.abs(dd('sue'))>=10)add(dd('sue')>0,`Dormiste ${fN(Math.abs(dd('sue')),0)} min ${dd('sue')>0?'más':'menos'} por noche (${fDur(K.sue[0])} h).`);
 if(vo2d!=null&&Math.abs(vo2d)>=.3)add(vo2d>0,`VO₂ máx ${vo2d>0?'subió':'bajó'} ${fN(Math.abs(vo2d))} en el período.`);
 if(pesod!=null&&Math.abs(pesod)>=.3)add(null,`Peso ${pesod<0?'bajó':'subió'} ${fN(Math.abs(pesod))} kg en el período.`);
 if(K.cu[0]!=null)add(K.cu[0]>=80,`Cumpliste ${fN(K.cu[0],0)}% de las sesiones planificadas.`);
 const hyC=eC.filter(e=>e.tipo==='hyrox'&&e.hyrox?.total),hyAnt=D.entrenos.filter(e=>e.tipo==='hyrox'&&e.hyrox?.total&&e.fecha<ini);
 const hyBest=hyC.length?Math.min(...hyC.map(e=>e.hyrox.total)):null,hyBestAnt=hyAnt.length?Math.min(...hyAnt.map(e=>e.hyrox.total)):null;
 if(hyBest!=null&&hyBestAnt!=null&&hyBest<hyBestAnt)add(true,`Nuevo mejor tiempo HYROX: ${fTime(hyBest)} (${fTime(hyBestAnt-hyBest)} más rápido).`);
 const paC=eC.filter(e=>e.tipo==='padel'&&e.padel?.res),paP=eP.filter(e=>e.tipo==='padel'&&e.padel?.res);
 const wr=a=>a.length?a.filter(e=>e.padel.res==='G').length/a.length*100:null;
 const prC=D.prs.filter(p=>p.fecha&&inR(p.fecha,ini,fin));
 if(prC.length)add(true,`${prC.length} récord${prC.length>1?'s':''} nuevo${prC.length>1?'s':''}: ${prC.slice(0,3).map(p=>p.nombre).join(', ')}.`);
 // volumen
 let vol;
 if(n===7){vol=[...Array(7)].map((_,i)=>{const f=addDays(ini,i);const es=eC.filter(e=>e.fecha===f);const segs=['crossfit','hyrox','padel'].map(k=>({k,v:es.filter(e=>e.tipo===k).reduce((a,e)=>a+(e.duracion||0),0),color:COLORS[k]}));const t=segs.reduce((a,s)=>a+s.v,0);const d=parseYmd(f);return{label:'DLMMJVS'[d.getDay()],tip:`${DIAS[d.getDay()]} ${fFecha(f)} · ${t} min`,segs};});}
 else{const W=n/7,lun=semanaLunes();vol=[...Array(W)].map((_,i)=>{const a=addDays(lun,-7*(W-1-i)),b=addDays(a,6);const es=D.entrenos.filter(e=>inR(e.fecha,a,b));const segs=['crossfit','hyrox','padel'].map(k=>({k,v:es.filter(e=>e.tipo===k).reduce((s,e)=>s+(e.duracion||0),0),color:COLORS[k]}));const d=parseYmd(a);return{label:`${d.getDate()}/${d.getMonth()+1}`,tip:`Semana ${fFecha(a)} · ${segs.filter(s=>s.v).map(s=>TIPOS[s.k]+' '+s.v).join(' · ')||'0'} min`,segs};});}
 const serie=k=>dC.filter(d=>d[k]!=null).map(d=>({x:d.fecha,y:k==='sueno_min'?d[k]/60:d[k]}));
 const diarioBarras=(k,color,div=1,unitTip='')=>{
  if(n<=28)return [...Array(n)].map((_,i)=>{const f=addDays(ini,i);const d=dC.find(x=>x.fecha===f);const v=d?.[k]!=null?d[k]/div:0;return{label:n===7?'DLMMJVS'[parseYmd(f).getDay()]:String(parseYmd(f).getDate()),tip:`${fFecha(f)} · ${d?.[k]!=null?fN(v,div>1?1:0)+unitTip:'sin dato'}`,segs:[{v,color}]};});
  const W=n/7,lun=semanaLunes();return [...Array(W)].map((_,i)=>{const a=addDays(lun,-7*(W-1-i)),b=addDays(a,6);const v=avg(D.dias.filter(d=>inR(d.fecha,a,b)).map(d=>d[k]));const d=parseYmd(a);return{label:`${d.getDate()}/${d.getMonth()+1}`,tip:`Semana ${fFecha(a)} · prom. ${v!=null?fN(v/div,div>1?1:0)+unitTip:'sin dato'}`,segs:[{v:v!=null?v/div:0,color}]};});
 };
 const kpi=(lbl,val,unit,d)=>`<div class="card tile" style="padding:14px;gap:6px"><span class="lbl">${lbl}</span><span class="num md">${val}<small> ${unit}</small></span>${d||'<span class="xs muted">sin comparación</span>'}</div>`;
 const sinWatch=!dC.length;
 return `
<header class="stack" style="gap:2px"><span class="eyebrow">Últimos ${per} · vs período anterior</span><h1 class="disp h1">Progreso</h1></header>
${progSeg()}
<div class="seg">${[[7,'7 días'],[28,'4 semanas'],[84,'12 semanas']].map(([k,l])=>`<button class="${n===k?'on':''}" data-act="rango" data-v="${k}">${l}</button>`).join('')}</div>
<section class="card"><span class="eyebrow">Lo destacado</span>
 ${ins.length?`<div class="stack" style="gap:12px">${ins.slice(0,6).map(i=>`<div class="ins"><span class="ar" style="color:${i.good===true?'var(--pa)':i.good===false?'var(--bad)':'var(--mu)'}">${i.good===true?'▲':i.good===false?'▼':'•'}</span><span>${esc(i.t)}</span></div>`).join('')}</div>`:`<p class="sm muted">${sinWatch&&!eC.length?'Aún no hay datos en este período. Registra entrenos y conecta el Watch para ver tu evolución.':'Necesito datos de dos períodos para comparar. Sigue registrando y aquí aparecerán tus mejoras.'}</p>`}
</section>
<section class="g2">
 ${kpi('Sesiones',eC.length,'',eP.length?deltaHtml(eC.length-eP.length,1,'',0):'')}
 ${kpi('Tiempo entrenado',fN(minC/60,1),'h',minP?deltaHtml((minC-minP)/60,1,' h'):'')}
 ${kpi('Cumplimiento plan',K.cu[0]!=null?fN(K.cu[0],0):'—','%',dd('cu')!=null?deltaHtml(dd('cu'),1,' pts',0):'')}
 ${kpi('Kcal activas/día',fN(K.kcal[0],0),'kcal',dd('kcal')!=null?deltaHtml(dd('kcal'),1,'',0):'')}
 ${kpi('Sueño promedio',K.sue[0]!=null?fDur(K.sue[0]):'—','h',dd('sue')!=null?deltaHtml(dd('sue'),1,' min',0):'')}

 ${kpi('FC reposo',fN(K.fc[0],0),'lpm',dd('fc')!=null?deltaHtml(dd('fc'),-1,' lpm',0):'')}

</section>

<section class="card"><div class="row between"><h2 class="disp h2">HRV</h2><span class="xs muted">más alto = mejor recuperación</span></div>${lineChart(serie('hrv'),'#6FA8FF',{unit:' ms',label:'HRV'})}</section>

function vEntrenos(){
 const f=ui.filtro;const list=D.entrenos.filter(e=>f==='todos'||e.tipo===f);
 let html=`<header class="row between" style="align-items:flex-end"><div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Progreso</span><h1 class="disp h1">Registro</h1></div><button class="btn pri" data-act="nuevoEntreno" style="border-radius:999px">${ico('plus',16,'#0B0C0E',2.6)}Registrar</button></header>
 ${progSeg()}
 <div class="seg">${[['todos','Todos'],...Object.entries(TIPOS)].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="filtro" data-v="${k}">${l}</button>`).join('')}</div>`;
 // HYROX
 const hy=D.entrenos.filter(e=>e.tipo==='hyrox'&&e.hyrox?.total);
 if((f==='todos'||f==='hyrox')&&hy.length){
  const L=hy[0],best=Math.min(...hy.map(e=>e.hyrox.total)),P=hy[1];
  const sp=(L.hyrox.splits||[]).map((s,i)=>({n:ESTACIONES[i],s})).filter(x=>x.s);const mx=Math.max(1,...sp.map(x=>x.s));
  const weak=new Set([...sp].sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.n));
  const est=sp.reduce((a,x)=>a+x.s,0);
  html+=`<section class="card"><div style="display:flex;flex-direction:column;gap:4px"><span class="xs" style="font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hy)">HYROX · ${esc(L.titulo||'Simulación')}</span><span class="num" style="font-size:52px">${fTime(L.hyrox.total)}</span><span class="xs muted">${fFecha(L.fecha)}${P?` · ${L.hyrox.total<=P.hyrox.total?'▼':'▲'} ${fTime(Math.abs(L.hyrox.total-P.hyrox.total))} vs anterior`:''} · mejor ${fTime(best)}</span></div>
  <div class="g3"><div class="tile"><span class="lbl">Running</span><span class="num md">${fTime(L.hyrox.running)}</span></div><div class="tile"><span class="lbl">Estaciones</span><span class="num md">${est?fTime(est):'—'}</span></div><div class="tile"><span class="lbl">Roxzone</span><span class="num md">${fTime(L.hyrox.roxzone)}</span></div></div>
  ${sp.length?`<div class="stack" style="gap:10px">${sp.map(x=>`<div style="display:flex;flex-direction:column;gap:5px"><div class="row between sm"><span>${x.n}</span><b style="font-variant-numeric:tabular-nums">${fTime(x.s)}</b></div><div class="bar"><i style="width:${(x.s/mx*100).toFixed(0)}%;background:${weak.has(x.n)?'var(--cf)':'var(--hy)'}"></i></div></div>`).join('')}</div><span class="row xs" style="gap:8px;color:#C9CDD3"><span style="width:10px;height:10px;border-radius:3px;background:var(--cf)"></span>Tus 2 estaciones más lentas: prioridad del bloque</span>`:''}
  </section>`;
 }
 // CrossFit PRs
 if(f==='todos'||f==='crossfit'){
  const seen=new Set();const prs=D.prs.filter(p=>{const k=p.nombre.trim().toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  const mes=today().slice(0,7);const nMes=D.prs.filter(p=>(p.fecha||'').startsWith(mes)).length;
  html+=`<section class="card"><div class="row between"><h2 class="disp h2">CrossFit · Récords</h2>${nMes?`<span class="xs" style="font-weight:700;color:var(--cf)">${nMes} PR este mes</span>`:''}</div>
  ${prs.length?`<div class="g2" style="gap:8px">${prs.map(p=>{const hist=D.prs.filter(x=>x.nombre.trim().toLowerCase()===p.nombre.trim().toLowerCase()).length;return `<button class="tile" data-act="editPR" data-v="${p.id}" style="border:0;color:var(--tx);text-align:left;font:inherit;cursor:pointer;padding:14px"><span class="xs muted">${esc(p.nombre)}</span><span class="num" style="font-size:30px">${esc(p.valor)}</span><span class="xs" style="font-weight:700;color:${p.fecha&&p.fecha.startsWith(mes)?'var(--cf)':'var(--mu)'}">${p.fecha?'PR · '+fFecha(p.fecha):''}${hist>1?` · ${hist} marcas`:''}</span></button>`;}).join('')}</div>`:'<p class="sm muted">Anota tus marcas: back squat, clean & jerk, Fran, etc.</p>'}
  <button class="btn" data-act="nuevoPR">${ico('plus',16)}Nuevo récord</button></section>`;
 }

 const pa=D.entrenos.filter(e=>e.tipo==='padel'&&e.padel?.res);
 if((f==='todos'||f==='padel')&&pa.length){
  const g=pa.filter(e=>e.padel.res==='G').length,p=pa.length-g;const u5=pa.slice(0,5);
  const kc=avg(pa.map(e=>e.kcal)),tor=pa.filter(e=>e.padel.torneo);const gt=tor.filter(e=>e.padel.res==='G').length;
  html+=`<section class="card"><div class="row between" style="align-items:flex-start"><div style="display:flex;flex-direction:column;gap:4px"><span class="xs" style="font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pa)">Pádel · 3ª categoría</span><span class="num" style="font-size:44px">${g} – ${p}</span><span class="xs muted">${fN(g/pa.length*100,0)}% de victorias · ${pa.length} partidos</span></div>

  <div class="g2" style="gap:8px"><div class="tile"><span class="lbl">Torneo</span><span class="num md">${tor.length?`${gt} – ${tor.length-gt}`:'—'}</span></div><div class="tile"><span class="lbl">Kcal / partido</span><span class="num md">${fN(kc,0)}</span></div></div></section>`;
 }
 html+=`<section class="card" style="gap:0"><h2 class="disp h2" style="padding-bottom:6px">Historial</h2>${list.length?list.slice(0,60).map(entItem).join(''):'<p class="sm muted" style="padding:10px 0">Sin registros todavía.</p>'}</section>`;
 return html;
}

 </ol></details>

const SYS=`Eres un coach experto en composición corporal y rendimiento para un atleta híbrido hombre que entrena CrossFit y HYROX y quiere volver a competir fuerte en pádel 3ª categoría en Chile. Analizas fotos de un check-in semanal (frente, perfil, espalda) y las comparas con el check-in anterior cuando existe.

const INSTR=`Devuelve exactamente este JSON:
{"resumen":"2-3 frases con la lectura principal","grasa_min":número,"grasa_max":número,"confianza":"baja|media|alta","cambios_vs_anterior":["..."],"zonas_progreso":["..."],"zonas_a_trabajar":["..."],"recomendaciones":["3 a 5 acciones concretas para la próxima semana: entrenamiento, nutrición y recuperación, considerando la carga de CrossFit, HYROX y pádel"],"calidad_fotos":"comentario breve para que las próximas fotos sean más comparables"}
Si no hay check-in anterior, "cambios_vs_anterior" va vacío.`;
function contexto(ck,prev,first){
 const med=c=>[c.peso!=null?`peso ${c.peso} kg`:null,...MEDIDAS.map(([k,l])=>c[k]!=null?`${l.toLowerCase()} ${c[k]} cm`:null)].filter(Boolean).join(', ')||'sin medidas';
 const des=addDays(ck.id,-7);const ds=D.dias.filter(d=>d.fecha>des&&d.fecha<=ck.id);
 const w=[['kcal activas/día','kcal',0],['min ejercicio/día','ejercicio',0],['sueño (h)','sueno_min',1],['HRV (ms)','hrv',0],['FC reposo','fc_reposo',0],['VO2máx','vo2max',1]].map(([l,k,dec])=>{let a=avg(ds.map(d=>d[k]));if(a==null)return null;if(k==='sueno_min')a/=60;return `${l} ${fN(a,dec)}`;}).filter(Boolean).join(', ');
 const es=D.entrenos.filter(e=>e.fecha>des&&e.fecha<=ck.id);const porT=Object.keys(TIPOS).map(k=>{const x=es.filter(e=>e.tipo===k);return x.length?`${TIPOS[k]}: ${x.length} sesiones, ${fN(x.reduce((a,e)=>a+(e.duracion||0),0),0)} min`:null;}).filter(Boolean).join('; ');
 const L=[`Check-in actual (${ck.id}): ${med(ck)}.`];
 if(ck.notas)L.push(`Notas del atleta: ${ck.notas}`);
 if(prev)L.push(`Check-in anterior (${prev.id}): ${med(prev)}.${prev.analisis?.resumen?' Lectura anterior: '+prev.analisis.resumen:''}`);
 if(first&&first!==prev)L.push(`Primer check-in (${first.id}): ${med(first)}.`);
 if(parseNum(S.metaPeso)!=null)L.push(`Meta de peso: ${parseNum(S.metaPeso)} kg.`);
 if(S.compNombre&&S.compFecha)L.push(`Próxima competencia: ${S.compNombre} el ${S.compFecha}.`);
 L.push(`Apple Watch últimos 7 días (promedios): ${w||'sin datos'}.`);
 L.push(`Entrenos últimos 7 días: ${porT||'sin registros'}.`);
 return L.join('\n');
}
async function analizar(id){
 const ck=D.checkins.find(c=>c.id===id);if(!ck)return;
 if(!S.apiKey){toast('Agrega tu API key de Claude en Ajustes');go('ajustes');return;}
 const angs=ANGULOS.filter(([k])=>ck.fotos?.[k]);if(!angs.length){toast('Agrega fotos al check-in');return;}
 ui.analizando=id;render();
 try{
  const idx=D.checkins.indexOf(ck);const prev=D.checkins.slice(0,idx).reverse().find(c=>c.fotos&&Object.keys(c.fotos).length);const first=idx>0?D.checkins[0]:null;
  const content=[{type:'text',text:contexto(ck,prev,first)}];
  for(const [k,l] of angs){content.push({type:'text',text:`FOTO ACTUAL · ${l} · ${ck.id}`});content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toB64(ck.fotos[k])}});}
  if(prev)for(const [k,l] of ANGULOS)if(prev.fotos?.[k]){content.push({type:'text',text:`FOTO ANTERIOR · ${l} · ${prev.id}`});content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toB64(prev.fotos[k])}});}
  content.push({type:'text',text:INSTR});
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.modelo||'claude-sonnet-5-5',max_tokens:2500,system:SYS,messages:[{role:'user',content}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===401?'API key inválida':r.status===429?'Límite de uso de la API: intenta más tarde':r.status===400&&/credit/i.test(j.error?.message||'')?'Sin saldo en la cuenta de la API':(j.error?.message||'Error de la API '+r.status));
  const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');const s=txt.indexOf('{'),e=txt.lastIndexOf('}');
  if(s<0)throw new Error('La respuesta no vino en el formato esperado');
  const a=JSON.parse(txt.slice(s,e+1));a.fecha=new Date().toISOString();a.modelo=S.modelo;
  ck.analisis=a;await dbPut('checkins',ck);toast('Análisis listo');
 }catch(err){toast(err.message||'Error al analizar');console.error(err);}
 finally{ui.analizando=null;await refresh();}
}

 const ck=D.checkins.find(c=>c.id===id);if(!ck)return;
 const files=ANGULOS.filter(([k])=>ck.fotos?.[k]).map(([k])=>new File([ck.fotos[k]],`forja-${id}-${k}.jpg`,{type:'image/jpeg'}));
 const text=`Check-in FORJA ${id} · ${[ck.peso!=null?'peso '+fN(ck.peso)+' kg':null,...MEDIDAS.map(([k,l])=>ck[k]!=null?l.toLowerCase()+' '+fN(ck[k])+' cm':null)].filter(Boolean).join(' · ')}`;
 if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:'Check-in FORJA',text});}catch(e){if(e.name!=='AbortError')toast('No se pudo compartir');}}
 else toast('Este navegador no permite compartir archivos');
}

/* ================= Respaldo ================= */
async function exportar(){
 toast('Preparando respaldo…');const cks=[];
 for(const c of D.checkins){const f={};for(const [k,b] of Object.entries(c.fotos||{}))f[k]=await blobToData(b);cks.push({...c,fotos:f});}
 const data={app:'FORJA',v:1,exportado:new Date().toISOString(),settings:{...S,apiKey:''},dias:D.dias,entrenos:D.entrenos,prs:D.prs,plan:D.plan,checkins:cks};
 const file=new File([JSON.stringify(data)],`forja-respaldo-${today()}.json`,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Respaldo FORJA'});return;}catch(e){if(e.name==='AbortError')return;}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
}
async function restaurar(file){
 const data=JSON.parse(await file.text());if(data.app!=='FORJA')throw new Error('No es un respaldo de FORJA');
 if(!confirm('Esto reemplaza los datos actuales por los del respaldo. ¿Continuar?'))return;
 for(const n of ['dias','entrenos','prs','checkins','plan'])await dbClear(n);
 for(const d of data.dias||[])await dbPut('dias',d);
 for(const x of data.plan||[])await dbPut('plan',x);
 for(const e of data.entrenos||[])await dbPut('entrenos',e);
 for(const p of data.prs||[])await dbPut('prs',p);
 for(const c of data.checkins||[]){const f={};for(const [k,u] of Object.entries(c.fotos||{}))f[k]=await(await fetch(u)).blob();await dbPut('checkins',{...c,fotos:f});}
 S={...DEF,...data.settings,apiKey:S.apiKey};await saveS();ui.draft=null;await refresh();toast('Respaldo restaurado');
}

/* ================= Eventos ================= */
const ACT={
 go:v=>go(v), sync:()=>syncGist(false), pegar:pegarSalud, importJson:()=>$('#fileJson').click(),
 angulo:v=>{ui.angulo=v;render();}, filtro:v=>{ui.filtro=v;render();},
 nuevoEntreno:()=>modalEntreno(), editEntreno:v=>modalEntreno(D.entrenos.find(x=>x.id==v)),
 delEntreno:async v=>{if(confirm('¿Eliminar este entreno?')){await dbDel('entrenos',Number(v));for(const p of D.plan.filter(p=>p.hecho==v)){delete p.hecho;await dbPut('plan',p);}closeModal();await refresh();}},
 nuevoPlan:v=>modalPlan(null,v), editPlan:v=>modalPlan(D.plan.find(x=>x.id==v)),
 hacerPlan:v=>{const p=D.plan.find(x=>x.id==v);if(p)modalEntreno(null,{fecha:p.fecha,tipo:p.tipo,titulo:p.titulo,duracion:p.duracion,notas:p.notas,planId:p.id});},
 delPlan:async v=>{if(confirm('¿Eliminar esta sesión del plan?')){await dbDel('plan',Number(v));closeModal();await refresh();}},
 delSerie:async v=>{const p=D.plan.find(x=>x.id==v);if(!p||!confirm('¿Eliminar esta sesión y todas las siguientes de la serie?'))return;for(const q of D.plan.filter(q=>q.serie===p.serie&&q.fecha>=p.fecha))await dbDel('plan',q.id);closeModal();await refresh();},
 semanaMov:v=>{ui.semana=v==='0'?0:ui.semana+Number(v);render();window.scrollTo(0,0);},
 scrollDia:v=>{const el=document.getElementById('d-'+v);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},
 copiarSemana,
 prog:v=>{ui.prog=v;render();}, rango:v=>{ui.rango=Number(v);render();},
 nuevoPR:()=>modalPR(), editPR:v=>modalPR(D.prs.find(x=>x.id==v)),
 delPR:async v=>{if(confirm('¿Eliminar este récord?')){await dbDel('prs',Number(v));closeModal();await refresh();}},
 cerrar:closeModal,
 quitarFoto:v=>{delete ui.draft.fotos[v];render();},
 guardarCheckin:()=>guardarCheckin(false),
 analizar:async v=>{if(view==='checkin'&&!(await guardarCheckin(true)))return;await analizar(v);},
 compartir:v=>compartir(v),
 copy:async v=>{try{await navigator.clipboard.writeText($('#'+v).textContent);toast('Copiado');}catch(e){toast('No se pudo copiar');}},
 exportar, importarBackup:()=>$('#fileBackup').click(),
 borrarTodo:async()=>{if(!confirm('¿Borrar TODOS los datos de FORJA en este iPhone? No se puede deshacer.'))return;for(const n of ['dias','entrenos','prs','checkins','plan'])await dbClear(n);S={...DEF,apiKey:S.apiKey,gistId:S.gistId,seedPlan:true};await saveS();ui.draft=null;await refresh();toast('Datos borrados');}
};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();try{await ACT[el.dataset.act]?.(el.dataset.v,el);}catch(err){console.error(err);toast(err.message||String(err));}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.d&&t.dataset.d!=='id'&&ui.draft)ui.draft[t.dataset.d]=t.value;});
document.addEventListener('change',async e=>{
 const t=e.target;
 try{
  if(t.dataset.foto){const f=t.files?.[0];if(!f)return;toast('Procesando foto…');ui.draft.fotos[t.dataset.foto]=await compress(f);render();return;}
  if(t.dataset.s){let val=t.value;if(t.dataset.s==='gistId'){S.gistSeen=[];}S[t.dataset.s]=val;await saveS();if(t.dataset.s==='gistId'&&gistIdLimpio())syncGist(false);return;}
  if(t.dataset.d==='id'){if(t.value){loadDraft(t.value);render();}return;}
  if(t.dataset.cmp){ui['cmp'+t.dataset.cmp]=t.value;render();return;}
  if(t.name==='tipo'&&t.form){t.form.querySelectorAll('[data-sec]').forEach(s=>s.hidden=s.dataset.sec!==t.value);return;}
  if(t.id==='fileJson'){const f=t.files?.[0];t.value='';if(f)await importarTexto(await f.text());return;}
  if(t.id==='fileBackup'){const f=t.files?.[0];t.value='';if(f)await restaurar(f);return;}
 }catch(err){console.error(err);toast(err.message||String(err));}
});
document.addEventListener('submit',async e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 try{const k=f.dataset.form;if(k==='entreno')await submitEntreno(f);else if(k==='plan')await submitPlan(f);else if(k==='pr')await submitPR(f);else if(k==='pegar'){await importarTexto(new FormData(f).get('txt'));closeModal();}}
 catch(err){console.error(err);toast(err.message||String(err));}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
/* tooltips de gráficos (hover en PC, toque en iPhone) */
const tip=$('#tip');
function showTip(el){const r=el.getBoundingClientRect();tip.textContent=el.getAttribute('data-tip');tip.style.left=clamp(r.left+r.width/2,70,window.innerWidth-70)+'px';tip.style.top=Math.max(40,r.top)+'px';tip.classList.add('show');clearTimeout(tip._h);tip._h=setTimeout(()=>tip.classList.remove('show'),2500);}
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('[data-tip]')&&e.pointerType==='mouse')tip.classList.remove('show');});
window.addEventListener('scroll',()=>tip.classList.remove('show'),{passive:true});

/* ================= Inicio ================= */
(async()=>{
 try{
  db=await openDB();S={...DEF,...(await dbGet('kv','settings')||{})};await loadAll();
  if(!S.seedPlan){if(!D.plan.length){await dbPut('plan',{fecha:'2026-10-20',hora:'18:00',tipo:'crossfit',titulo:'CrossFit',duracion:60});await dbPut('plan',{fecha:'2026-10-20',hora:'19:30',tipo:'padel',titulo:'Pádel',duracion:90});}S.seedPlan=true;await saveS();await loadAll();}
  go('hoy');
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  autoSync();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoSync();});
 }catch(err){$('#view').innerHTML=`<p class="down">No se pudo iniciar: ${esc(err.message)}</p>`;}
})();
</script>
